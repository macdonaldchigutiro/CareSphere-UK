name: CareSphere CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: caresphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caresphere_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: caresphere_backend/requirements.txt

      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - name: Check production security settings
        run: python manage.py check --deploy
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-production-readiness-key-not-used-outside-ci
          ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - name: Check health endpoint
        run: >-
          python manage.py shell -c
          "from django.test import Client; response=Client(HTTP_HOST='localhost').get('/api/health/');
          assert response.status_code == 200 and response.json() == {'status': 'ok'}"
      - name: Run CQC discovery tests
        run: >-
          python manage.py test
          apps.care_providers.test_cqc_directory
          apps.care_providers.test_postcode_geo

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caresphere_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: caresphere_frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api

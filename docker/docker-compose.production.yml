version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: caresphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caresphere
      POSTGRES_USER: caresphere
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - caresphere_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: caresphere_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - caresphere_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./caresphere_backend
      dockerfile: Dockerfile.production
    container_name: caresphere_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://caresphere:${DB_PASSWORD}@postgres:5432/caresphere
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CQC_API_KEY: ${CQC_API_KEY}
      NHS_API_KEY: ${NHS_API_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - caresphere_network
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        gunicorn caresphere_backend.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --worker-class gthread
      "

  # Celery Worker
  celery_worker:
    build:
      context: ./caresphere_backend
      dockerfile: Dockerfile.production
    container_name: caresphere_celery_worker
    restart: unless-stopped
    depends_on:
      - redis
      - backend
    environment:
      DATABASE_URL: postgresql://caresphere:${DB_PASSWORD}@postgres:5432/caresphere
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - caresphere_network
    command: celery -A caresphere_backend worker --loglevel=info --concurrency=4

  # Celery Beat
  celery_beat:
    build:
      context: ./caresphere_backend
      dockerfile: Dockerfile.production
    container_name: caresphere_celery_beat
    restart: unless-stopped
    depends_on:
      - redis
      - backend
    environment:
      DATABASE_URL: postgresql://caresphere:${DB_PASSWORD}@postgres:5432/caresphere
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - caresphere_network
    command: celery -A caresphere_backend beat --loglevel=info

  # Frontend
  frontend:
    build:
      context: ./caresphere_frontend
      dockerfile: Dockerfile.production
    container_name: caresphere_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    networks:
      - caresphere_network
    command: npm start

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: caresphere_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - caresphere_network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: caresphere_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - caresphere_network
    ports:
      - "9090:9090"

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: caresphere_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - caresphere_network
    ports:
      - "3001:3000"

networks:
  caresphere_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
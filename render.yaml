services:
  - type: web
    name: caresphere-api-staging
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: caresphere_backend
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --worker-class gthread caresphere_backend.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.16"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "caresphere-api-staging.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: "https://caresphere-uk-staging-macdonald.vercel.app"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "CareSphere UK <onboarding@resend.dev>"
      - key: RESEND_TIMEOUT
        value: "10"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: SECURE_HSTS_SECONDS
        value: "3600"

<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(14, 165, 233, 0.3)" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="28" fill="url(#logoGradient)" opacity="0.1" />
  
  <!-- Main Icon - Caring Hands -->
  <path d="M15 35 Q25 20 35 35 Q45 20 55 35 Q45 50 35 35 Q25 50 15 35" 
        fill="url(#logoGradient)" 
        filter="url(#shadow)" />
  
  <!-- Heart in center -->
  <path d="M30 25 C25 20 20 25 25 30 C27 32 30 35 30 35 C30 35 33 32 35 30 C40 25 35 20 30 25" 
        fill="white" 
        opacity="0.9" />
  
  <!-- Company Name -->
  <text x="70" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#logoGradient)">
    CareSphere UK
  </text>
  
  <!-- Tagline -->
  <text x="70" y="48" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Transforming Care Coordination
  </text>
</svg>